project:
  name: "ecg-arrhythmia-classifier"
  seed: 42

data:
  raw_dir: "data/raw/mitbih"
  processed_dir: "data/processed"
  train_file: "ds1_train.npz"
  test_file: "ds2_test.npz"
  sampling_rate: 360

signal_processing:
  bandpass_low: 0.5
  bandpass_high: 40.0
  filter_order: 4
  norm_window_sec: 4.0
  window_before_r: 96
  window_after_r: 160
  r_match_tolerance_ms: 50.0

model:
  in_channels: 1
  signal_length: 256
  rr_features_dim: 6
  cnn_embed_dim: 128
  rr_embed_dim: 32
  dropout: 0.3

training:
  seed: 42
  n_folds: 5
  batch_size: 128
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0001
  focal_gamma: 2.0
  effective_samples_beta: 0.9999
  checkpoint_dir: "checkpoints"